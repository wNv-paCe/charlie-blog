name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/wnv-pace/charlie-blog-backend:latest
            ghcr.io/wnv-pace/charlie-blog-backend:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            docker pull ghcr.io/wnv-pace/charlie-blog-backend:latest

            docker run --rm \
              --env-file /opt/charlie-blog/backend.env \
              ghcr.io/wnv-pace/charlie-blog-backend:latest \
              alembic upgrade head

            docker stop charlie-blog-backend || true
            docker rm charlie-blog-backend || true

            docker run -d \
              --name charlie-blog-backend \
              --restart unless-stopped \
              --env-file /opt/charlie-blog/backend.env \
              -p 127.0.0.1:8080:8080 \
              ghcr.io/wnv-pace/charlie-blog-backend:latest
